{% extends "base.html" %}
{% block title %}Handoff · Handoff Tracker{% endblock %}
{% block styles %}
<link rel="stylesheet" href="/static/css/sheet.css">
<link rel="stylesheet" href="/static/css/print.css" media="print">
{% endblock %}

{% block content %}
<div class="sheet-wrap">
  <div class="sheet-top no-print">
    <a class="back" href="/board">&larr; Board</a>
    <div class="acts" id="view-acts">
      <button class="btn sm" type="button" onclick="window.print()">Print</button>
    </div>
  </div>
  <div class="print-head" aria-hidden="true"><span id="print-title">Handoff sheet</span><span id="print-stamp"></span></div>

  <!-- Filled by handoff-view.js -->
  <div id="handoff-content">
    <div class="empty"><p>Loading handoff...</p></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/handoff-view.js"></script>
{% endblock %}
